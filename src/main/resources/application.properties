# ===============================
# Database
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/authdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Bhupesh@2001

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=9898

# ===============================
# Kafka Producer
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
spring.kafka.topic.name=testing_json

# Producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Don?t send type headers (so consumers don?t choke on class mismatch)
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.expensetracker=DEBUG

# ===============================
# JWT
# ===============================
jwt.expiration.time=3600000
jwt.refresh.expiration.time=86400000